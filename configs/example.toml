[model]
# Request [0, 1] to run both mod branches; beta1=0 shares the plaquette fits.
N = 2
beta = 1.0
beta1 = 0.0
alpha = 0.0
alpha1 = 0.0
mod = [1]

[renormalization]
beta1_methods = ["magsus", "corrG"]
# Optional single topo correction; 1plaq always runs.
alpha_topo_fit = true
type = ["z"]
# Linear blocking factor; this is the patch L used by legacy 1plaq/2plaq fits.
factor = 4

[runtime]
# true tunes all stage widths before sampling; false uses the [chains] values.
auto_chains = true
device = "cuda"
dtype = "float64"
# All batch seeds are deterministic offsets from this seed, so resumed runs reproduce data.
seed = 1018

[chains]
# Manual batch widths, also used as search seeds when auto_chains=true.
pilot = 32
two_plaq = 1024
observable_fine = 64
observable_coarse = 64
one_plaq = 2048
topo_fine = 128
topo_coarse = 128

[pilot]
# Pilot chains are independent PBC replicas used only to estimate xi_G.
initial_L = 32
max_L = 128
# Increase L until L / (xi_G + 2*xi_G_err) reaches this threshold.
min_L_over_xi_G = 2.5
# Next L = ceil(pilot_growth_margin * min_L_over_xi_G * (xi_G + 2*xi_G_err)),
# capped at max_L. Margin 1 removes growth headroom without changing the pass condition.
pilot_growth_margin = 1.25
# Warmup and production stop adaptively between these limits.
min_warmup = 400
max_warmup = 4000
# Unlike frozen-boundary fits below, these measurement counts are totals across chains.
min_meas_total = 10000
target_ess = 1000
max_meas_total = 50000

[geometry]
boundary_bc = "OBC"
# Nonnegative padding overrides the xi_G rule; -1 uses ceil(padding_xi_G_mul * xi_G).
padding = -1
# A value >= 2 fixes the observable coarse lattice; -1 derives it from obs_L_xi_G_mul.
coarse_L = -1
# Optional bounds for automatically derived values. -1 means unbounded.
padding_min = -1
padding_max = -1
coarse_L_min = 10
coarse_L_max = -1
# These multipliers are consulted only when the corresponding override is -1.
padding_xi_G_mul = 2.0
obs_L_xi_G_mul = 6.0

[hmc]
# epsilon is the initial/adaptation value. trajectory_length remains fixed while
# the sampler changes the leapfrog count and effective epsilon.
epsilon = 0.05
trajectory_length = 1.0
mass_a = 1.0
mass_z = 1.0
target_accept = 0.8
adapt_steps = 200
# This tunes epsilon for both outer lattices and inner patches. Inner patches then
# restore the cropped equilibrium state and start production without another warmup.
# Outer warmup stops when tau is long enough and stable within this tolerance.
warmup_tau_multiplier = 40
tau_stability_rtol = 0.25
s_step = 1.0
s_updates = 3

[diagnostics]
# strict=true turns acceptance/warmup/ESS warnings into pipeline errors.
min_accept = 0.70
max_accept = 0.95
strict = false

[scan.beta1]
# Explicit points are simulated first; min/max bound any automatic bracket expansion.
min = -32.0
max = 32.0
points = []
growth_factor = 2.0
max_rounds = 7
# Once a target is bracketed, bisect until the coupling interval is this narrow.
refine_tolerance = 0.02
max_refine_rounds = 10
# Build an odd, uniform final grid from the preliminary bootstrap coupling error.
fit_points = 5
fit_sigma_multiplier = 5.0
# Widen spacing after insufficient separation, capped by fit_spacing_max.
fit_spacing_growth_factor = 2.0
fit_spacing_min = 0.01
fit_spacing_max = 0.5
fit_confidence_sigma = 2.0
max_fit_grid_rounds = 5

[scan.alpha]
min = 0.01
max = 4.0
points = []
growth_factor = 2.0
max_rounds = 7
refine_tolerance = 0.002
max_refine_rounds = 10
fit_points = 5
fit_sigma_multiplier = 5.0
# Widen spacing after insufficient separation, capped by fit_spacing_max.
fit_spacing_growth_factor = 2.0
fit_spacing_min = 0.001
fit_spacing_max = 0.05
fit_confidence_sigma = 2.0
max_fit_grid_rounds = 5

[steps.two_plaq]
# chains is GPU batch width, not the number of fitted boundaries. fit_times is
# rounded upward to a whole batch.
fit_times = 5000
# These warmup limits apply only to the outer boundary lattice. The inner patch
# uses adapt_steps above to tune epsilon on a random interior, then restores the
# complete equilibrium crop before production.
min_warmup = 400
max_warmup = 4000
# Every boundary receives at least this many samples. A batch stops together
# after every chain reaches target ESS, or at max_meas_per_boundary.
min_meas_per_boundary = 4096
target_ess_per_boundary = 1024
max_meas_per_boundary = 32768
bins = 128
p0 = { U = [2.0, 0.0], z = [2.0, 0.0] }

[steps.observable]
# Observable/topology stages do not use frozen boundaries; their measurement
# budgets remain aggregate totals shared across chains.
min_warmup = 400
max_warmup = 8000
min_meas_total = 100000
target_ess = 5000
max_meas_total = 500000

[steps.one_plaq]
# Same batching and per-boundary semantics as two_plaq.
fit_times = 3000
min_warmup = 400
max_warmup = 4000
min_meas_per_boundary = 2048
target_ess_per_boundary = 512
max_meas_per_boundary = 16384
zero_pad = 1
p0 = { U = 1.0, z = 1.0 }

[steps.topo]
min_warmup = 400
max_warmup = 8000
min_meas_total = 100000
target_ess = 5000
max_meas_total = 500000

[storage]
# Persist raw measurement arrays; scalar JSON caches are always saved.
save_npz = false
